# Netlify reads this file when building the selected production branch.
# The policy passed private Report-Only checks on main@f75331c.
# Repeat the HTTPS/browser checks after deploying this enforcing header.
# Keep the policy aligned with config/securityHeaders.js.
[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "24"

[[headers]]
for = "/*"

[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=()"
Content-Security-Policy = "default-src 'self'; script-src 'self' https://googleapis.com https://*.googleapis.com https://*.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.googleapis.com https://*.gstatic.com https://*.googleusercontent.com https://*.google.com https://*.ggpht.com; connect-src 'self' https://googleapis.com https://*.googleapis.com https://*.gstatic.com https://*.google.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; frame-ancestors 'none'"
